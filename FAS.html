<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Faculty Affairs Operations Platform</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--crim:#9d2235;--ink:#152430;--mute:#5d707d;--line:#dfe4e6;--bg:#eef1f1}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 'Segoe UI',Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-top:4px solid var(--crim);border-radius:12px;padding:30px 30px 26px;box-shadow:0 12px 32px rgba(21,36,48,.08)}
.brand{display:flex;gap:12px;align-items:center;margin-bottom:22px}
.seal{background:var(--crim);color:#fff;border-radius:8px;padding:9px 10px;font:700 16px Cambria,Georgia,serif;letter-spacing:.5px}
.brand b{display:block;font:600 16px/1.25 Cambria,Georgia,serif}
.brand small{display:block;color:var(--mute);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
h1{font:600 22px/1.25 Cambria,Georgia,serif;margin:0 0 6px}
p{margin:0 0 18px;color:var(--mute);font-size:13.5px}
label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:700;margin-bottom:6px}
.row{position:relative}
input[type=password],input[type=text]{width:100%;font:inherit;font-size:16px;border:1px solid #c3ccd3;border-radius:8px;padding:11px 74px 11px 12px;color:var(--ink)}
input:focus{outline:3px solid #2b6cb0;outline-offset:1px;border-color:#2b6cb0}
.show{position:absolute;right:6px;top:6px;border:0;background:#f4f6f6;border-radius:6px;padding:6px 10px;font:inherit;font-size:12.5px;color:var(--ink);cursor:pointer}
.keep{display:flex;gap:8px;align-items:center;margin:12px 0 18px;font-size:13px;color:var(--ink);text-transform:none;letter-spacing:0;font-weight:400}
button.go{width:100%;border:0;background:var(--crim);color:#fff;border-radius:8px;padding:12px;font:inherit;font-size:15px;font-weight:650;cursor:pointer}
button.go:hover{background:#861d2d}
button.go:disabled{opacity:.6;cursor:wait}
.err{min-height:20px;margin-top:12px;font-size:13px;color:#b91c1c}
.foot{margin-top:20px;padding-top:14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--mute)}
</style></head>
<body>
<form class="card" id="f" autocomplete="off">
  <div class="brand"><span class="seal">FAS</span><span><b>Faculty Affairs Operations Platform</b><small>Harvard FAS</small></span></div>
  <h1>Enter the password</h1>
  <p>This platform is protected. The content stays encrypted until the password is entered.</p>
  <label for="pw">Password</label>
  <div class="row"><input id="pw" type="password" autocomplete="current-password" autofocus required><button type="button" class="show" id="sh">Show</button></div>
  <label class="keep"><input type="checkbox" id="keep"> Keep me signed in until I close this browser tab</label>
  <button class="go" id="go" type="submit">Open the platform</button>
  <div class="err" id="err" role="alert"></div>
  <div class="foot">Created by Narissa Khomkhai &middot; Demonstration dataset &middot; Not an official Harvard system.</div>
</form>
